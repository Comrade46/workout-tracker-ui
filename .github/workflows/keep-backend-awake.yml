# Keeps the free Render backend from going to sleep.
#
# Render's free plan stops the API after ~15 minutes without traffic,
# and the next visitor then waits 1-2 minutes. Pinging /api/health every
# 5 minutes keeps it awake (fits in Render's 750 free hours per month for
# one service). GitHub Actions is free for public repositories.
#
# GitHub may delay scheduled runs a little at busy times, and pauses
# schedules after 60 days without any commit to this repository.

name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API health
        run: |
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 15 \
               --max-time 150 \
               https://workout-tracker-api-fwlz.onrender.com/api/health
